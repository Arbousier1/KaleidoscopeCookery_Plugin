name: Build and test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CraftEngine main compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out latest CraftEngine source
        uses: actions/checkout@v4
        with:
          repository: Xiao-MoMi/craft-engine
          ref: main
          path: craft-engine

      # Main sources target Java 21, while the Minecraft 26.x NMS bridges
      # target Java 25. Gradle discovers both installed toolchains.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read CraftEngine source versions
        id: craft_engine
        shell: bash
        run: |
          craft_engine_version="$(grep '^project_version=' craft-engine/gradle.properties | cut -d= -f2-)"
          nms_helper_version="$(grep '^nms_helper_version=' craft-engine/gradle.properties | cut -d= -f2-)"
          echo "version=${craft_engine_version}" >> "$GITHUB_OUTPUT"
          echo "nms_helper_version=${nms_helper_version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C craft-engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish latest CraftEngine APIs to Maven Local
        working-directory: craft-engine
        run: >-
          bash ./gradlew
          :core:publishToMavenLocal
          :core:adventure:publishToMavenLocal
          :bukkit:proxy:publishToMavenLocal
          :bukkit:publishToMavenLocal
          -Dorg.gradle.jvmargs=-Xmx4G
          --stacktrace
          --no-daemon

      - name: Build latest CraftEngine server plugin
        working-directory: craft-engine
        run: >-
          bash ./gradlew
          :bukkit:loader:shadowJar
          -Dorg.gradle.jvmargs=-Xmx4G
          --stacktrace
          --no-daemon

      - name: Build and test against latest CraftEngine source
        run: >-
          bash ./gradlew build
          -PcraftEngineVersion=${{ steps.craft_engine.outputs.version }}
          -PcraftEngineNmsHelperVersion=${{ steps.craft_engine.outputs.nms_helper_version }}
          --stacktrace
          --no-daemon

      - name: Record tested CraftEngine revision
        if: always()
        shell: bash
        run: |
          echo "### CraftEngine source under test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.craft_engine.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.craft_engine.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare CraftEngine resource-pack integration test
        shell: bash
        run: |
          mkdir -p run/plugins/CraftEngine/resources
          mkdir -p run/plugins/KaleidoscopeCookeryPlugin
          cp craft-engine/target/craft-engine-bukkit-plugin-*.jar run/plugins/
          cp -R craft-engine-pack/custom run/plugins/CraftEngine/resources/custom
          cat > run/plugins/KaleidoscopeCookeryPlugin/config.yml <<'EOF'
          console:
            language: en_us
          metrics:
            enabled: false
          EOF
          echo 'eula=true' > run/eula.txt

      - name: Load plugin and resource pack on Paper
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 180s bash ./gradlew runServer \
            -PcraftEngineVersion=${{ steps.craft_engine.outputs.version }} \
            -PcraftEngineNmsHelperVersion=${{ steps.craft_engine.outputs.nms_helper_version }} \
            --stacktrace --no-daemon
          status=$?
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit "$status"
          fi
          test -f run/logs/latest.log
          grep -F 'CraftEngine block registry check passed' run/logs/latest.log
          if grep -E 'Found [1-9][0-9]* issue\(s\)|CraftEngine block registry check failed' run/logs/latest.log; then
            echo 'CraftEngine reported resource configuration errors.' >&2
            exit 1
          fi

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KaleidoscopeCookeryPlugin-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload CraftEngine pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KaleidoscopeCookery-CraftEngine-pack-${{ github.sha }}
          path: craft-engine-pack/custom
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            build/reports/**
            build/test-results/**
            run/logs/**
          if-no-files-found: ignore
          retention-days: 7
