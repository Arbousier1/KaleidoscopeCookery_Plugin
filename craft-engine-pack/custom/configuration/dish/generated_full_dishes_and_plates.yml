items:
  cook:candied_potato:
    category: cook:food
    material: minecraft:nether_brick
    data:
      item_name: "<!i><#E8A33D><lang:item.cook.candied_potato>"
      components:
        minecraft:max_stack_size: 1
    texture: minecraft:item/custom/cook/food/candied_potato
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: any
          alignment: any
      furniture:
        settings:
          item: cook:candied_potato
          hit_times: 3
          sounds:
            place: minecraft:block.wood.place
            break: minecraft:block.wood.break
            hit: minecraft:block.wood.hit
        loot:
          template: default:loot_table/furniture
          arguments:
            item: cook:candied_potato
        variants:
          ground:
            elements:
              - item: cook:candied_potato_display_0
                scale: 1
                position: 0,0.5,0
            hitboxes:
              - position: 0,0,0
                type: interaction
                width: 1
                height: 0.5
                interactive: true
          stage_1:
            elements:
              - item: cook:candied_potato_display_1
                scale: 1
                position: 0,0.5,0
            hitboxes:
              - position: 0,0,0
                type: interaction
                width: 1
                height: 0.5
                interactive: true
          stage_2:
            elements:
              - item: cook:candied_potato_display_2
                scale: 1
                position: 0,0.5,0
            hitboxes:
              - position: 0,0,0
                type: interaction
                width: 1
                height: 0.5
                interactive: true
          stage_3:
            elements:
              - item: cook:candied_potato_display_3
                scale: 1
                position: 0,0.5,0
            hitboxes:
              - position: 0,0,0
                type: interaction
                width: 1
                height: 0.5
                interactive: true
        events:
          - on: right_click
            functions:
              - type: set_food
                add: true
                food: 5
              - type: set_saturation
                add: true
                saturation: 2.75
              - type: play_sound
                sound: minecraft:entity.generic.eat
              - type: swing_hand
              - type: when
                source: <arg:furniture.variant>
                cases:
                  - when: ground
                    functions:
                      - type: set_furniture_variant
                        variant: stage_1
                  - when: stage_1
                    functions:
                      - type: set_furniture_variant
                        variant: stage_2
                  - when: stage_2
                    functions:
                      - type: set_furniture_variant
                        variant: stage_3
                  - when: stage_3
                    functions:
                      - type: remove_furniture
                        drop-loot: false

  cook:candied_potato_display_0:
    material: minecraft:nether_brick
    model:
      type: minecraft:model
      path: minecraft:block/custom/cook/block/food/candied_potato_0
  cook:candied_potato_display_1:
    material: minecraft:nether_brick
    model:
      type: minecraft:model
      path: minecraft:block/custom/cook/block/food/candied_potato_1
  cook:candied_potato_display_2:
    material: minecraft:nether_brick
    model:
