categories:  
  cook:food:  
    icon: cook:blaze_lamb_chop
    name: "<gradient:#FF6B35:#FFD700><l10n:category.cook.food></gradient>"
    list:  
      - cook:blaze_lamb_chop  
      - cook:braised_fish  
      - cook:chorus_fried_egg  
      - cook:cold_style_sashimi  
      - cook:crystal_lamb_chop  
      - cook:dark_cuisine  
      - cook:desert_style_sashimi  
      - cook:dongpo_pork  
      - cook:end_style_sashimi  
      - cook:fondant_pie  
      - cook:fondant_spider_eye  
      - cook:frost_lamb_chop  
      - cook:golden_salad  
      - cook:nether_style_sashimi  
      - cook:pan_seared_knight_steak  
      - cook:slime_ball_meal  
      - cook:spicy_chicken  
      - cook:stargazy_pie  
      - cook:suspicious_stir_fry  
      - cook:sweet_and_sour_ender_pearls  
      - cook:tundra_style_sashimi  
      - cook:yakitori
      - cook:shengjian_mantou
      
##############    
# 模板    
##############    
    
templates#items:        
  cook:furniture/consumable_item:          
    material: nether_brick          
    data:          
      item-name: <!i>${item_name}        
      components:      
        minecraft:max_stack_size: 1      
    model:          
      template: internal:model/simplified_generated          
      arguments:          
        path: block/custom/cook/block/food/item/${__ID__}          
    behavior:          
      type: craftengine:furniture_item          
      furniture: ${__NAMESPACE__}:${__ID__}          
      rules:          
        ground:          
          rotation: any          
          alignment: any      
      
  cook:furniture/consumable_display:        
    material: nether_brick        
    model:        
      path: ${model_path}    

##############    
# 物品配置    
