# 食谱    
  kaleidoscopecookery:recipe_item_no_recipe:  
    material: nether_brick  
    data:  
      item-name: <!i><lang:item.kaleidoscopecookery.recipe_item_no_recipe>  
    texture: minecraft:item/custom/cook/recipe_item_no_recipe  
    behavior:  
      type: furniture_item  
      rules:  
        wall:  
          alignment: any  
      furniture:  
        settings:  
          item: kaleidoscopecookery:recipe_item  
          hit_times: 3  
          sounds:  
            break: minecraft:block.metal.break  
            place: minecraft:block.metal.place  
            hit: minecraft:block.metal.hit  
        behavior:  
          - type: kaleidoscopecookery:recipe_furniture
        loot:  
          template: default:loot_table/furniture  
          arguments:  
            item: kaleidoscopecookery:recipe_item  
        variants:  
          wall:  
            loot_spawn_offset: 0,0,0.3  
            elements:  
              - type: item_display  
                item: show:recipe_block  
                position: 0,0,0.5  
                pitch: 90 
                billboard: fixed  
            hitboxes:  
              - type: interaction  
                can_use_item_on: true  
                can_be_hit_by_projectile: true  
                blocks_building: false
                position: 0.3,-0.4,0.05  
                width: 0.1
                height: 0.8
                interactive: false
                invisible: true
              - type: interaction  
                can_use_item_on: true  
                can_be_hit_by_projectile: true  
                blocks_building: true  
                position: 0.2,-0.4,0.05  
                width: 0.1
                height: 0.8
                interactive: false
                invisible: true
              - type: interaction  
                can_use_item_on: true  
                can_be_hit_by_projectile: true  
                blocks_building: false  
                position: 0.1,-0.4,0.05  
                width: 0.1
                height: 0.8
                interactive: false
                invisible: true
              - type: interaction  
                can_use_item_on: true  
                can_be_hit_by_projectile: true  
                blocks_building: false 
                position: 0,-0.4,0.05  
                width: 0.1
                height: 0.8
                interactive: false
                invisible: true
              - type: interaction  
                can_use_item_on: true  
                can_be_hit_by_projectile: true  
                blocks_building: false
                position: -0.1,-0.4,0.05  
                width: 0.1
                height: 0.8
                interactive: false
                invisible: true
              - type: interaction  
                can_use_item_on: true  
                can_be_hit_by_projectile: true  
                blocks_building: false
