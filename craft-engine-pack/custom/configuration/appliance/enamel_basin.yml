items:
              
  kaleidoscopecookery:enamel_basin:      
    material: nether_brick      
    data:      
      item-name: <!i><lang:item.kaleidoscopecookery.enamel_basin>  
    texture: minecraft:item/custom/cook/enamel_basin   
    behavior:      
      type: block_item      
      block:      
        loot:      
          template: default:loot_table/self      
        settings:      
          template:      
            - default:sound/metal      
          overrides:      
            hardness: 0.5      
            resistance: 1.0      
            replaceable: false      
            is-redstone-conductor: false      
            is-suffocating: false      
            instrument: basedrum      
            map-color: 15      
            tags:      
              - minecraft:mineable/pickaxe      
            correct-tools:      
              template: default:pickaxe_power/level_1   
        behaviors:       
          - type: kaleidoscopecookery:cooking_enamel_basin      
        states:          
          properties:          
            facing:          
              type: 4-direction          
              default: north  
            oil_level:  
              type: int  
              default: 0  
              min: 0  
              max: 4  
          appearances:      
            base_north:          
              state: soul_campfire[lit=false, signal_fire=true, facing=east]  
              transparent: true     
              entity-renderer:      
                item: show:enamel_basin_base     
                yaw: 180      
            base_south:      
              state: soul_campfire[lit=false, signal_fire=true, facing=east]   
              transparent: true     
              entity-renderer:      
                item: show:enamel_basin_base      
            base_east:      
              state: soul_campfire[lit=false, signal_fire=true, facing=east]  
              transparent: true     
