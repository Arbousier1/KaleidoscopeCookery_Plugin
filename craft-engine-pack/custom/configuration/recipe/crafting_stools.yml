# 配置：厨凳工作台配方。
templates:
  kaleidoscopecookery:cook_stool_recipe:
    type: shaped
    category: building
    pattern:
      - AAA
      - B B
    ingredients:
      A: minecraft:${wood_type}_planks
      B: minecraft:${wood_type}_slab
    result:
      id: kaleidoscopecookery:cook_stool_${wood_type}
      count: 1

recipes:
  # 配方：金合欢木厨凳（kaleidoscopecookery:cook_stool_acacia）
  # 材料：金合欢木板 x3、金合欢木台阶 x2
  kaleidoscopecookery:cook_stool_acacia:
    template: kaleidoscopecookery:cook_stool_recipe
    arguments:
      wood_type: acacia
  # 配方：竹厨凳（kaleidoscopecookery:cook_stool_bamboo）
  # 材料：竹板 x3、竹台阶 x2
