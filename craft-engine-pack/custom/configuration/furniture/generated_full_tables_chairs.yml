categories:
  kaleidoscopecookery:generated_original_furniture:
    name: "<!i><white><l10n:category.kaleidoscopecookery.generated_original_furniture>"
    icon: kaleidoscopecookery:chair_oak
    hidden: true
    list:
      - kaleidoscopecookery:chair_oak
      - kaleidoscopecookery:chair_spruce
      - kaleidoscopecookery:chair_acacia
      - kaleidoscopecookery:chair_bamboo
      - kaleidoscopecookery:chair_birch
      - kaleidoscopecookery:chair_cherry
      - kaleidoscopecookery:chair_crimson
      - kaleidoscopecookery:chair_dark_oak
      - kaleidoscopecookery:chair_jungle
      - kaleidoscopecookery:chair_mangrove
      - kaleidoscopecookery:chair_warped

items:
  kaleidoscopecookery:chair_oak:
    material: minecraft:nether_brick
    data:
      item_name: "<!i><lang:item.kaleidoscopecookery.chair_oak>"
    model: minecraft:block/custom/cook/block/chair/oak
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      furniture:
        events:
          - template: default:rotatable_furniture_4
        settings:
          item: kaleidoscopecookery:chair_oak
          hit_times: 3
          sounds:
            break: minecraft:block.wood.break
            place: minecraft:block.wood.place
            hit: minecraft:block.wood.hit
        variants:
          ground:
            loot_spawn_offset: 0.5,0.5,0
            elements:
              - item: kaleidoscopecookery:chair_oak
                display_transform: none
                billboard: fixed
                position: 0,0,0
                translation: 0,0.5,0
                shadow_radius: 0
                shadow_strength: 0.2
            hitboxes:
              - position: 0,0,0
                type: interaction
                width: 1
                height: 1
                interactive: true
                interaction_entity: true
                seats:
                  - 0,-0.15,0
        loot:
          template: default:loot_table/furniture
          arguments:
            item: kaleidoscopecookery:chair_oak

