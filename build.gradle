plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.2.2"
}

def craftEngineVersion = "26.8-SNAPSHOT"
def craftEngineNmsHelperVersion = "1.0.229"
def craftEngineDevDir = providers.gradleProperty("craftEngineDevDir").orNull

def nmsVersions = [
        nmsV121R1: [path: 'v1_21_R1', dependency: '1.21.1-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R2: [path: 'v1_21_R2', dependency: '1.21.3-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R3: [path: 'v1_21_R3', dependency: '1.21.4-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R4: [path: 'v1_21_R4', dependency: '1.21.5-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R5: [path: 'v1_21_R5', dependency: '1.21.8-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R6: [path: 'v1_21_R6', dependency: '1.21.10-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV121R7: [path: 'v1_21_R7', dependency: '1.21.11-R0.1-SNAPSHOT', classifier: 'remapped-mojang'],
        nmsV261R1: [path: 'v26_1_R1', dependency: '26.1.2-R0.1-SNAPSHOT', javaVersion: 25],
        nmsV262R1: [path: 'v26_2_R1', dependency: '26.2-R0.1-SNAPSHOT', javaVersion: 25],
]

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "codemc-nms"
        url = "https://repo.codemc.io/repository/nms/"
    }
    maven {
        name = "xenondevsReleases"
        url = "https://repo.xenondevs.xyz/releases"
    }
    maven {
        url = "https://repo.momirealms.net/releases/"
    }
    maven {
        url = "https://repo.momirealms.net/snapshots/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/releases/"
    }
}

nmsVersions.each { sourceSetName, version ->
    sourceSets.create(sourceSetName) {
        java.srcDir("src/nms/${version.path}/java")
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    if (craftEngineDevDir != null) {
        compileOnly(files(
                "${craftEngineDevDir}/bukkit/build/libs/craft-engine-bukkit-${craftEngineVersion}.jar",
                "${craftEngineDevDir}/core/build/libs/craft-engine-core-${craftEngineVersion}.jar",
                "${craftEngineDevDir}/core/adventure/build/libs/adventure-bundle.jar",
                "${craftEngineDevDir}/bukkit/proxy/build/libs/proxy.jarinjar"
        ))
    } else {
        compileOnly("net.momirealms:craft-engine-bukkit:${craftEngineVersion}")
        compileOnly("net.momirealms:craft-engine-core:${craftEngineVersion}")
        compileOnly("net.momirealms:craft-engine-adventure:${craftEngineVersion}")
        compileOnly("net.momirealms:craft-engine-bukkit-proxy:${craftEngineVersion}")
    }
    compileOnly("net.momirealms:craft-engine-nms-helper-mojmap:${craftEngineNmsHelperVersion}")
    compileOnly("net.momirealms:craft-engine-nms-helper:${craftEngineNmsHelperVersion}")
    compileOnly("io.netty:netty-all:4.1.135.Final")
    compileOnly("com.mojang:datafixerupper:10.0.21")
    compileOnly("net.momirealms:sparrow-util:0.119")
    compileOnly("net.momirealms:sparrow-nbt:0.20")
    compileOnly("net.momirealms:sparrow-nbt-legacy-codec:0.20")
    compileOnly("net.momirealms:sparrow-nbt-codec:0.20")
    compileOnly("net.momirealms:sparrow-nbt-adventure:0.20")
    compileOnly("net.momirealms:sparrow-heart:0.69")
    compileOnly("net.momirealms:sparrow-metadata:1.13")
    compileOnly("net.momirealms:sparrow-reflection:0.33")
    compileOnly("net.momirealms:sparrow-reflection-proxy-scanner:1.1")
    compileOnly("me.clip:placeholderapi:2.11.6")
    implementation("net.momirealms:antigrieflib:1.0.16")
    implementation("org.bstats:bstats-bukkit:3.2.1")

    nmsVersions.each { sourceSetName, version ->
        def notation = "org.spigotmc:spigot:${version.dependency}"
        if (version.classifier != null) {
            notation += ":${version.classifier}"
        }
        add("${sourceSetName}CompileOnly", notation)
    }
}

shadowJar {
    archiveClassifier.set('')
    from(nmsVersions.keySet().collect { sourceSets.named(it).get().output })
    relocate 'net.momirealms.antigrieflib', 'net.kaleidoscope.cookery.libs.antigrieflib'
    relocate 'org.bstats', 'net.kaleidoscope.cookery.libs.bstats'
}

jar {
    enabled = false
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
    dependsOn('javadocJar')
}

tasks {
    runServer {
        minecraftVersion("26.1.2")
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

nmsVersions.each { sourceSetName, version ->
    if (version.javaVersion != null) {
        tasks.named(sourceSets[sourceSetName].compileJavaTaskName, JavaCompile) {
            options.release.set(21)
            javaCompiler.set(javaToolchains.compilerFor {
                languageVersion = JavaLanguageVersion.of(version.javaVersion)
            })
        }
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addBooleanOption('Xdoclint:none', true)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
